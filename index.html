<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Academy</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f1a;
    color: white;
    display: flex;
    justify-content: center;
}

/* Wrapper för centrering */
.wrapper {
    width: 100%;
    max-width: 500px;
    padding: 20px;
    text-align: center;
}

/* Rubrik */
h1 {
    margin-top: 20px;
    font-size: 28px;
}

/* Sektioner */
.section {
    background: #111827;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
}

/* Knappar */
button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    background: #eab308;
    color: black;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

/* Hover */
button:hover {
    background: #facc15;
}

/* Mobiljustering */
@media (max-width: 480px) {
    h1 {
        font-size: 24px;
    }

    button {
        font-size: 15px;
        padding: 16px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

<h1>📡 DX Academy</h1>
<p>Lär dig DX-ing från grunden – direkt i mobilen</p>

<div class="section">
    <h2>🎓 Lektioner</h2>
    <button onclick="location.href='lektion1.html'">Lektion 1</button>
    <button onclick="location.href='lektion2.html'">Lektion 2</button>
</div>

<div class="section">
    <h2>🧠 AI-verktyg</h2>
    <button onclick="location.href='ai_niva1.html'">Identifiera station</button>
</div>

<div class="section">
    <h2>📡 DX-OS</h2>
    <button onclick="location.href='testcenter.html'">Öppna system</button>
</div>

</div>

</body>
</html>
